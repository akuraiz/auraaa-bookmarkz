<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8e9ec;--panel:#fff;--soft:#f6f6f7;--soft2:#ececef;--line:#e7e8eb;--text:#101217;--mute:#6a7280;--pri:#111318;--priText:#fff;--acc:#ff7a1a;--ok:#16a34a;--bad:#dc2626;--warn:#b45309;--glass:rgba(255,255,255,.88);--sh:0 1px 2px rgba(16,18,23,.04),0 10px 28px rgba(16,18,23,.08);--ease:cubic-bezier(.22,1,.36,1)}
[data-theme=dark]{--bg:#0c0d10;--panel:#16181d;--soft:#1d2026;--soft2:#262a31;--line:#2a2e36;--text:#eef0f3;--mute:#98a1ae;--pri:#f3f4f6;--priText:#111318;--glass:rgba(24,27,32,.88);--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-feature-settings:"cv11","ss03";-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.s{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.s.sm{width:15px;height:15px}.s.lg{width:22px;height:22px}
.s.arrow{width:34px;height:34px;stroke-width:2.2;display:block;margin:0 auto 8px;color:var(--ok);animation:nudge 1.3s ease-in-out infinite}
.app{display:grid;grid-template-columns:252px 1fr;gap:12px;padding:12px;min-height:100vh;max-width:1480px;margin:0 auto}
.side,.main,.wrap{background:var(--panel);border:1px solid var(--line);border-radius:18px;transition:background-color .3s,border-color .3s}
.side{padding:12px;position:sticky;top:12px;height:calc(100vh - 24px);overflow:auto}
.tile{width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.tile.sm{width:30px;height:30px;border-radius:9px}
.tile.dk{background:#111318;border-color:#111318;color:var(--acc)}
.brand{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;background:var(--soft)}
.brand b{display:block;font-size:14px;letter-spacing:-.01em}.brand small{color:var(--mute);font-size:12px}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--mute);margin:16px 10px 6px}
.nav{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:1px solid transparent;background:none;border-radius:10px;cursor:pointer;text-align:left;color:var(--mute);transition:background-color .2s,color .2s,border-color .2s}
.nav:hover{background:var(--soft);color:var(--text)}
.nav.on{background:var(--soft);border-color:var(--line);color:var(--text);font-weight:600}
.nav::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--acc);transform:scaleY(0);transition:transform .3s var(--ease)}
.nav.on::before{transform:scaleY(1)}
.nav span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .n{font-size:11px;font-weight:600;color:var(--mute);background:var(--soft2);padding:1px 7px;border-radius:99px;flex:none}
.main{min-width:0}
.top{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:0 10px;color:var(--mute);transition:border-color .2s,box-shadow .2s,background-color .2s}
.search:focus-within{background:var(--panel);border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,122,26,.18);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
.search input{flex:1;border:0;background:none;outline:0;padding:10px 0;min-width:0;color:var(--text)}
kbd{font:600 11px/1 "JetBrains Mono",ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:3px 6px;color:var(--mute);background:var(--panel)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;gap:7px;align-items:center;justify-content:center;transition:background-color .2s,transform .15s var(--ease),box-shadow .2s,opacity .2s,border-color .2s,color .2s}
.btn:hover{background:var(--soft)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);color:var(--priText);border-color:var(--pri)}.btn.pri:hover{opacity:.9;background:var(--pri)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.ok:hover{background:var(--ok);opacity:1}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.ico{padding:0;width:38px;height:38px}.btn.sm.ico{width:30px;height:30px}
.menu{display:none}
.content{padding:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:5px}
.sl{display:flex;align-items:center;gap:7px;padding:6px 8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.sv{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sv.t{font-size:15px;padding:18px 12px 17px}
.head{display:flex;align-items:center;gap:10px}.head h2{margin:0;font-size:20px;letter-spacing:-.02em}
.pill{font-size:12px;font-weight:600;color:var(--mute);background:var(--soft);border:1px solid var(--line);padding:2px 10px;border-radius:99px}
#tag,.tag{color:var(--mute)}#tag{margin:4px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:5px;display:flex;flex-direction:column;transition:transform .3s var(--ease),box-shadow .3s,border-color .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.card .in{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
.ctop{display:flex;gap:10px;align-items:center}.cm{flex:1;min-width:0}
.card h3{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h3:hover{text-decoration:underline;text-underline-offset:3px}
.chip{font-size:12px;color:var(--mute)}
.card p{margin:0;color:var(--mute);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.acts{display:flex;gap:6px;padding:6px 1px 1px}.acts .btn{flex:1;padding:8px 10px}
.star{border:0;background:none;cursor:pointer;color:var(--mute);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;transition:color .2s,transform .25s var(--ease),background-color .2s}
.star:hover{background:var(--soft)}.star:active{transform:scale(.8)}.star.on{color:var(--acc)}.star.on .s{fill:currentColor}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:56px 10px}
.empty .tile{margin:0 auto 12px;width:48px;height:48px;border-radius:14px;background:var(--soft)}
.more{display:block;margin:16px auto 0}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes nudge{0%,100%{transform:translateY(5px)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.45)}100%{box-shadow:0 0 0 7px rgba(22,163,74,0)}}
.grid.anim .card{animation:rise .45s var(--ease) backwards;animation-delay:calc(var(--i,0)*24ms)}
.shade{position:fixed;inset:0;background:rgba(10,12,16,.38);backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:20}.shade.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(420px,calc(100vw - 24px));background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:22px;z-index:30;padding:16px;overflow:auto;opacity:0;visibility:hidden;transform:translateX(28px) scale(.98);transition:transform .45s var(--ease),opacity .25s,visibility .45s;box-shadow:0 24px 60px rgba(0,0,0,.2)}
.drawer.on{opacity:1;visibility:visible;transform:none}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dh .tile{width:44px;height:44px;border-radius:13px;background:var(--acc);background:linear-gradient(145deg,var(--acc),color-mix(in srgb,var(--acc) 72%,#000));border:0;color:#fff}
.dh h2{margin:0;font-size:17px;letter-spacing:-.02em}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mute)}.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
.x{margin-left:auto;border:1px solid var(--line);background:var(--panel);border-radius:10px;width:32px;height:32px;cursor:pointer;color:var(--mute);display:grid;place-items:center;flex:none;transition:background-color .2s,color .2s,transform .2s var(--ease)}
.x:hover{background:var(--soft);color:var(--text)}.x:active{transform:scale(.9)}
.dp{margin:0 0 12px;color:var(--mute)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.mini small{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:11px;font-weight:500}
.mini b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;margin:14px 0 12px}
.seg button{position:relative;z-index:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--mute);cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center;transition:color .25s}
.seg button.on{color:var(--text)}
.seg .ind{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .4s var(--ease)}
.seg[data-i="1"] .ind{transform:translateX(100%)}.seg[data-i="2"] .ind{transform:translateX(200%)}
.pane{display:none}.pane.on{display:block;animation:fade .35s var(--ease)}
.st{list-style:none;margin:12px 0 0;padding:0;counter-reset:s;display:grid;gap:10px}
.st li{counter-increment:s;display:flex;gap:10px;align-items:flex-start}
.st li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--soft2);border:1px solid var(--line);font-size:12px;font-weight:600;display:grid;place-items:center}
.dz{text-align:center;padding:10px 6px 4px}.dz p{color:var(--mute);margin:12px 0 0;font-size:13px}
.drag{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:2px solid #4ade80;background:var(--panel);color:var(--text);text-decoration:none;font-weight:600;cursor:grab;box-shadow:0 0 0 4px rgba(74,222,128,.18);transition:box-shadow .25s,transform .25s var(--ease)}
.drag:hover{transform:translateY(-1px);box-shadow:0 0 0 7px rgba(74,222,128,.22)}.drag:active{cursor:grabbing}.drag .s{pointer-events:none}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--mute);font-size:13px;margin-top:14px}.note .s{margin-top:2px}
.box{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}.box p{margin:4px 0 0;color:var(--mute)}
pre,textarea.i{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
pre{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:150px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#111318;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .25s,transform .35s var(--ease);z-index:50;pointer-events:none;max-width:90vw;box-shadow:var(--sh)}
.toast.on{opacity:1;transform:translateX(-50%)}
/* admin */
#adminApp{display:none;padding:12px;min-height:100vh}
body.admin #adminApp{display:block}body.admin .app{display:none}
.wrap{max-width:1040px;margin:0 auto}
.ahead{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:6px 16px 0;border-bottom:1px solid var(--line);overflow:auto}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--mute);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center;transition:color .2s,border-color .25s}
.tab:hover{color:var(--text)}.tab.on{color:var(--text);border-color:var(--acc)}
.abody{padding:16px;animation:fade .35s var(--ease)}
.scroll{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
tr:hover td{background:var(--soft)}
.rn{display:flex;align-items:center;gap:10px}
.badge{font:600 11px/1 Inter,system-ui,sans-serif;padding:4px 9px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--text)}
button.badge{cursor:pointer;transition:transform .15s var(--ease)}button.badge:active{transform:scale(.94)}
.badge.g{color:var(--ok)}.badge.r{color:var(--bad)}.badge.y{color:var(--warn)}
label.f{display:block;font-size:12px;font-weight:500;color:var(--mute);margin:12px 0 5px}
.i{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--text);transition:border-color .2s,box-shadow .2s,background-color .2s}
.i:focus{outline:0;background:var(--panel);border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,122,26,.18)}
textarea.i{font-size:12px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pk{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--soft);cursor:pointer;display:grid;place-items:center;color:var(--mute);transition:background-color .2s,color .2s,transform .2s var(--ease),border-color .2s}
.pk:hover{color:var(--text);transform:translateY(-1px)}.pk.on{background:var(--pri);color:var(--priText);border-color:var(--pri)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.log{white-space:pre-wrap;font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;min-height:40px}
.login{max-width:380px;margin:12vh auto;padding:24px}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.m{display:flex;gap:8px;align-items:flex-start;margin:8px 0 0}.m .s{margin-top:2px}
.m.ok{color:var(--ok)}.m.bad{color:var(--bad)}.m.warn{color:var(--warn)}.m.note{color:var(--acc)}.m span{color:var(--text)}.m.bad span{color:var(--bad)}
.ch{display:flex;gap:8px;align-items:center}.ch.ok{color:var(--ok)}.ch.bad{color:var(--bad)}.ch b{color:var(--text)}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.app{grid-template-columns:1fr;padding:8px}.side{position:fixed;left:8px;top:8px;bottom:8px;width:262px;z-index:40;height:auto;transform:translateX(-120%);transition:transform .4s var(--ease)}.side.on{transform:none}.menu{display:inline-flex}.two{grid-template-columns:1fr}kbd{display:none}.drawer{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:88vh;transform:translateY(40px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- code cleaning, checking, link building ---------- */
function clean(raw,n){n=n||[];var c=String(raw||'').trim(),m;
  m=c.match(/href\s*=\s*(["'])\s*javascript:([\s\S]*?)\1/i);
  if(m){c=m[2].replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');n.push('Extracted the code from an HTML link.')}
  if(/^javascript:/i.test(c)){c=c.replace(/^javascript:/i,'').trim();n.push('Removed the "javascript:" prefix.')}
  if(!/\s/.test(c)&&(c.match(/%[0-9A-Fa-f]{2}/g)||[]).length>=3&&/%(7B|3B|28|27|22)/i.test(c)){try{c=decodeURIComponent(c);n.push('Decoded %-encoded text.')}catch(e){}}
  return c}
function mk(c){return 'javascript:'+encodeURIComponent('(function(){'+c+'\n})();')}
function analyze(raw){var notes=[],c=clean(raw,notes),err=null,w=[];
  if(!c)return{code:'',notes:notes,err:'No code yet.',warns:w,url:''};
  try{new Function('(function(){'+c+'\n})();')}catch(e){if(e instanceof EvalError)w.push('Syntax check is unavailable in this browser.');else err=e.message}
  if(c.length>30000)w.push('Very large ('+Math.round(c.length/1024)+' KB). Some browsers may cut long bookmarks.');
  if(/document\.write\s*\(|document\.open\s*\(/.test(c))w.push('document.write/open can erase the whole page.');
  if(/\beval\s*\(/.test(c))w.push('Uses eval(), which many sites block.');
  if(/['"]http:\/\//.test(c))w.push('Loads from http:// which is blocked on https pages.');
  if(/\bdebugger\b/.test(c))w.push('Contains a debugger statement.');
  if(!/\b(alert|prompt|confirm|document|window|location|navigator|console|fetch|XMLHttpRequest|localStorage)\b/.test(c))w.push('Does not seem to touch the page. Is this the right code?');
  return{code:c,notes:notes,err:err,warns:w,url:err?'':mk(c)}}
var cc={};function analyzeC(c){return cc[c]||(cc[c]=analyze(c))}

/* ---------- data ---------- */
function setDb(d){db={settings:Object.assign({},DEF,d.settings||{}),updated:d.updated,items:(d.items||[]).map(function(x){return{id:String(x.id||uid()),name:x.name||'',category:x.category||'General',icon:x.icon||'bookmark',desc:x.desc||'',code:x.code||'',status:x.status==='draft'?'draft':'published'}})}}
function load(){
  var seed=JSON.parse($('seed').textContent);
  return fetch('data.json?'+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return seed}).then(setDb);
}
function isPub(x){return x.status==='published'}
function favIcon(s){var col=/^#[0-9a-f]{6}$/i.test(s.accent)?s.accent:'#ff7a1a';
  return 'data:image/svg+xml,'+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='#111318'/><g transform='translate(5 5) scale(.583)' fill='none' stroke='"+col+"' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>"+(P[s.logo]||P.bookmark)+"</g></svg>")}
function applySettings(s){document.title=s.siteName;document.documentElement.style.setProperty('--acc',s.accent);$('brandName').textContent=s.siteName;$('brandLogo').innerHTML=I(s.logo,'lg');$('tag').textContent=s.tagline;$('fav').href=favIcon(s)}

/* ---------- shared helpers ---------- */
function fb(t){var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok}
function copyText(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(function(){return true},function(){return fb(t)});return Promise.resolve(fb(t))}
var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2400)}
function dl(name,text){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function fmtDate(d){try{return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}catch(e){return ''}}

var favs=store('bl_favs2')||[],view='all',query='',PAGE=48,shown=PAGE,at;
function pubItems(){return db.items.filter(isPub)}
function byId(id){return db.items.filter(function(x){return x.id===id})[0]}
function navBtn(key,ic,label,n){return '<button class="nav'+(view===key?' on':'')+'" data-v="'+esc(key)+'">'+I(ic)+'<span>'+label+'</span><span class="n">'+n+'</span></button>'}
function stat(ic,l,v,t){return '<div class="stat"><div class="sl">'+I(ic,'sm')+l+'</div><div class="sv'+(t?' t':'')+'">'+v+'</div></div>'}
function render(anim){
  var pub=pubItems(),cats={};pub.forEach(function(x){cats[x.category]=(cats[x.category]||0)+1});
  if(view.indexOf('c:')===0&&!cats[view.slice(2)])view='all';
  var nf=pub.filter(function(x){return favs.indexOf(x.id)>=0}).length,ck=Object.keys(cats).sort();
  $('count').textContent=pub.length+' bookmarklets';
  $('stats').innerHTML=stat('bookmark','Bookmarklets',pub.length)+stat('folder','Categories',ck.length)+stat('star','Favorites',nf)+stat('clock','Last updated',db.updated?esc(fmtDate(db.updated)):'Not published yet',1);
  $('navMain').innerHTML=navBtn('all','grid','All',pub.length)+navBtn('fav','star','Favorites',nf);
  $('navCats').innerHTML=ck.map(function(c){return navBtn('c:'+c,'folder',esc(c),cats[c])}).join('');
  var q=query.toLowerCase().trim();
  var l=pub.filter(function(x){
    if(view==='fav'&&favs.indexOf(x.id)<0)return false;
    if(view.indexOf('c:')===0&&x.category!==view.slice(2))return false;
    return !q||(x.name+' '+x.desc+' '+x.category).toLowerCase().indexOf(q)>=0});
  $('title').textContent=view==='all'?'All bookmarklets':view==='fav'?'Favorites':view.slice(2);
  $('sub').textContent=l.length+' found';
  var g=$('grid');
  if(anim){g.classList.add('anim');clearTimeout(at);at=setTimeout(function(){g.classList.remove('anim')},900)}
  g.innerHTML=l.length?l.slice(0,shown).map(function(x,n){var f=favs.indexOf(x.id)>=0;
    return '<div class="card" style="--i:'+Math.min(n,12)+'"><div class="in"><div class="ctop"><div class="tile">'+I(x.icon)+'</div><div class="cm"><h3 data-open="'+esc(x.id)+'">'+esc(x.name)+'</h3><div class="chip">'+esc(x.category)+'</div></div><button class="star'+(f?' on':'')+'" data-fav="'+esc(x.id)+'" title="Favorite" aria-label="Favorite">'+I('star')+'</button></div><p>'+esc(x.desc)+'</p></div><div class="acts"><button class="btn pri" data-copy="'+esc(x.id)+'">'+I('copy','sm')+'Copy</button><button class="btn" data-open="'+esc(x.id)+'">'+I('plus','sm')+'How to add</button></div></div>'}).join(''):'<div class="empty"><div class="tile">'+I(view==='fav'?'star':'search')+'</div>'+(view==='fav'?'No favorites yet. Tap the star on a card.':'Nothing found.')+'</div>';
  $('more').style.display=l.length>shown?'block':'none';
}
function doCopy(id,btn){var x=byId(id);if(!x)return;copyText(mk(clean(x.code))).then(function(ok){
  if(ok&&btn){if(!btn._h)btn._h=btn.innerHTML;btn.classList.add('ok');btn.innerHTML=I('check','sm')+'Copied';setTimeout(function(){if(btn._h){btn.classList.remove('ok');btn.innerHTML=btn._h;btn._h=null}},1700)}
  toast(ok?'Copied. Paste it in the bookmark URL box.':'Copy failed. Open the item and drag it instead.')})}

function closeDrawer(){$('drawer').classList.remove('on');$('side').classList.remove('on');$('shade').classList.remove('on')}

  var a=$('dragLink');a.setAttribute('href',mk(clean(x.code)));a.addEventListener('click',function(e){e.preventDefault();toast('Drag it to the bookmarks bar, or use Copy.')})}

/* ---------- ADMIN ---------- */
var work=null,tab='lib',editId=null,aq='',aShown=50;
function sameData(a,b){return JSON.stringify([a.settings,a.items])===JSON.stringify([b.settings,b.items])}
function dirty(){return !sameData(work,db)}
function saveDraft(){store('bl_draft',dirty()?work:null);updChip()}
function updChip(){var c=$('chip');if(c){var d=dirty();c.className='badge '+(d?'y':'g');c.textContent=d?'Unpublished changes':'Up to date'}var b=$('disc');if(b)b.style.display=dirty()?'':'none'}
function cur(){return work.items.filter(function(x){return x.id===editId})[0]}
function hash(p){var s='bl:'+p;if(window.crypto&&crypto.subtle&&window.TextEncoder)return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return('0'+x.toString(16)).slice(-2)}).join('')});var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return Promise.resolve('x'+(h>>>0).toString(16))}
function showAdmin(){document.body.classList.add('admin');work=store('bl_draft')||clone(db);if(sameData(work,db))work=clone(db);
  if(store('bl_auth',undefined,true)){renderAdmin()}else renderLogin()}
function hideAdmin(){document.body.classList.remove('admin');applySettings(db.settings);render(true)}
function renderLogin(){var first=!db.settings.adminHash&&!work.settings.adminHash;
  $('adminApp').innerHTML='<div class="wrap login"><div class="tile dk" style="margin-bottom:14px">'+I('lock')+'</div><h2 style="margin:0 0 4px;letter-spacing:-.02em">'+(first?'Create a passphrase':'Sign in')+'</h2><p class="tag" style="margin:0 0 12px">'+(first?'Choose a passphrase (6+ characters).':'Enter your passphrase.')+'</p><input class="i" id="pw" type="password" placeholder="Passphrase" autocomplete="off"><p id="pwErr" style="color:var(--bad);margin:6px 0"></p><button class="btn pri" style="width:100%" data-a="login">'+(first?'Create and continue':'Sign in')+'</button><p style="text-align:center"><a href="#" data-a="exit" class="tag">Back to site</a></p></div>';
  var p=$('pw');if(p)p.focus()}
function doLogin(){var p=$('pw').value,cur0=db.settings.adminHash||work.settings.adminHash;
  hash(p).then(function(h){
    if(!cur0){if(p.length<6){$('pwErr').textContent='Use at least 6 characters.';return}work.settings.adminHash=h;saveDraft()}
    else if(h!==cur0){$('pwErr').textContent='Wrong passphrase.';return}
    store('bl_auth',1,true);renderAdmin()})}
function renderAdmin(){
  var T=[['lib','Library','layers'],['set','Settings','sliders'],['pub','Publish','upload']];
  if(tab==='edit')T.splice(1,0,['edit','Editing','edit']);
  $('adminApp').innerHTML='<div class="wrap"><div class="ahead"><div class="tile dk">'+I('shield')+'</div><b style="font-size:16px">Admin</b><span id="chip" class="badge"></span><button class="btn sm" id="disc" data-a="discard">'+I('undo','sm')+'Discard changes</button><span style="flex:1"></span><button class="btn" data-a="exit">'+I('eye','sm')+'View site</button><button class="btn" data-a="logout">'+I('logout','sm')+'Sign out</button></div><div class="tabs">'+T.map(function(t){return '<button class="tab'+(tab===t[0]?' on':'')+'" data-a="tab:'+t[0]+'">'+I(t[2],'sm')+t[1]+'</button>'}).join('')+'</div><div class="abody" id="abody"></div></div>';
  updChip();
  if(tab==='lib')tabLib();else if(tab==='edit')tabEdit();else if(tab==='set')tabSet();else tabPub()}
function picker(kind,sel){return PICK.map(function(n){return '<button type="button" class="pk'+(sel===n?' on':'')+'" data-pick="'+kind+':'+n+'" title="'+n+'">'+I(n)+'</button>'}).join('')}

function tabLib(){
  var np=work.items.filter(isPub).length;
  $('abody').innerHTML='<div class="row2" style="margin:0 0 12px"><label class="search" style="flex:1;min-width:160px;max-width:none">'+I('search','sm')+'<input id="aq" placeholder="Search library" value="'+esc(aq)+'" autocomplete="off"></label><button class="btn pri" data-a="new">'+I('plus','sm')+'New bookmarklet</button></div><p class="tag">'+work.items.length+' total · '+np+' published · '+(work.items.length-np)+' drafts. Changes save automatically as a draft until you publish.</p><div class="scroll" id="tbl"></div>';
  drawTbl()}
function drawTbl(){
  var q=aq.toLowerCase(),l=work.items.filter(function(x){return !q||(x.name+' '+x.category).toLowerCase().indexOf(q)>=0});
  var h='<table><tr><th>Name</th><th>Category</th><th>Status</th><th></th></tr>'+l.slice(0,aShown).map(function(x){var r=x.code?analyzeC(x.code):null;
    return '<tr><td><div class="rn"><div class="tile sm">'+I(x.icon,'sm')+'</div><b>'+esc(x.name||'(no name)')+'</b></div></td><td>'+esc(x.category)+'</td><td><button class="badge '+(isPub(x)?'g':'')+'" data-a="tog:'+x.id+'" title="Click to switch">'+(isPub(x)?'Published':'Draft')+'</button>'+(!x.code?' <span class="badge r">no code</span>':r.err?' <span class="badge r" title="'+esc(r.err)+'">error</span>':'')+'</td><td style="white-space:nowrap;text-align:right"><button class="btn sm ico" data-a="edit:'+x.id+'" title="Edit">'+I('edit','sm')+'</button> <button class="btn sm ico" data-a="dup:'+x.id+'" title="Duplicate">'+I('copy','sm')+'</button> <button class="btn sm ico" data-a="up:'+x.id+'" title="Move up">'+I('up','sm')+'</button> <button class="btn sm ico" data-a="dn:'+x.id+'" title="Move down">'+I('down','sm')+'</button> <button class="btn sm ico" data-a="del:'+x.id+'" title="Delete">'+I('trash','sm')+'</button></td></tr>'}).join('')+'</table>';
  if(!l.length)h='<div class="empty">Nothing here yet. Press New bookmarklet.</div>';
  if(l.length>aShown)h+='<button class="btn more" data-a="more">Show more</button>';
  $('tbl').innerHTML=h}

function tabEdit(){var x=cur();if(!x){tab='lib';return renderAdmin()}
  var cats={};work.items.forEach(function(o){cats[o.category]=1});
  $('abody').innerHTML='<button class="btn" data-a="back">'+I('left','sm')+'Back to library</button><div class="two" style="margin-top:12px"><div><label class="f">Name</label><input class="i" data-f="name" value="'+esc(x.name)+'"><label class="f">Category</label><input class="i" data-f="category" list="catlist" value="'+esc(x.category)+'"><datalist id="catlist">'+Object.keys(cats).map(function(c){return '<option value="'+esc(c)+'">'}).join('')+'</datalist><label class="f">Icon</label><div class="picker">'+picker('icon',x.icon)+'</div><label class="f">Short description (shown on the card)</label><input class="i" data-f="desc" value="'+esc(x.desc)+'"><label class="f">Status</label><select class="i" data-f="status"><option value="published"'+(isPub(x)?' selected':'')+'>Published (visible to users)</option><option value="draft"'+(isPub(x)?'':' selected')+'>Draft (hidden)</option></select><label class="f">Code: paste anything, it gets cleaned automatically</label><textarea class="i" data-f="code" rows="12" spellcheck="false">'+esc(x.code)+'</textarea></div><div id="chk"></div></div>';
  updateChk()}
function msg(k,t){return '<p class="m '+k+'">'+I(k==='note'?'sparkle':k==='ok'?'check':'alert','sm')+'<span>'+esc(t)+'</span></p>'}
function updateChk(){var x=cur(),el=$('chk');if(!x||!el)return;var r=analyze(x.code),nm=x.name.trim().toLowerCase();
  var dupe=nm&&work.items.some(function(o){return o.id!==x.id&&o.name.trim().toLowerCase()===nm});
  var h='<div class="box"><div class="ch '+(r.err?'bad':'ok')+'">'+I(r.err?'alert':'check')+'<b>'+(r.err?'Problem found':'Looks good')+'</b></div>';
  if(r.err)h+=msg('bad',r.err);
  else if(r.code)h+='<p class="tag" style="margin:6px 0 0">Syntax is valid (checked without running it). Syntax checks cannot catch everything, so test it on a real page below.</p>';
  r.notes.forEach(function(n){h+=msg('note',n)});
  r.warns.forEach(function(n){h+=msg('warn',n)});
  if(dupe)h+=msg('warn','Another bookmarklet has this name.');
  h+='</div>';
  if(r.code&&!r.err)h+='<div class="box"><b>Test it</b><p class="tag" style="margin:6px 0 12px">Drag this to your bookmarks bar, then click it on any page.</p><div class="dz" style="text-align:left;padding:0"><a class="drag" id="tLink" draggable="true">'+I(x.icon,'sm')+esc(x.name||'Test')+'</a> <button class="btn" data-a="copycur">'+I('copy','sm')+'Copy</button></div></div>';
  if(r.code)h+='<details><summary class="tag" style="cursor:pointer">Cleaned code ('+r.code.length+' characters)</summary><pre>'+esc(r.code.slice(0,3000))+'</pre></details>';
  if(!r.err&&r.code&&!isPub(x))h+='<button class="btn pri" style="width:100%;margin-top:10px" data-a="pubone">'+I('check','sm')+'Mark as published</button>';
  el.innerHTML=h;var a=$('tLink');if(a){a.setAttribute('href',r.url);a.onclick=function(e){e.preventDefault();toast('Drag it to the bookmarks bar.')}}}

function tabSet(){var s=work.settings;
  $('abody').innerHTML='<div class="two"><div><b>Site look</b><label class="f">Site name</label><input class="i" data-s="siteName" value="'+esc(s.siteName)+'"><label class="f">Welcome text</label><input class="i" data-s="tagline" value="'+esc(s.tagline)+'"><label class="f">Logo icon (also the browser tab icon)</label><div class="picker">'+picker('logo',s.logo)+'</div><label class="f">Accent color</label><input type="color" data-s="accent" value="'+esc(s.accent)+'" style="width:60px;height:36px;border:0;background:none;cursor:pointer"><p class="tag">Changes apply to the site after you publish.</p></div><div><b>Passphrase</b><label class="f">New passphrase (6+ characters)</label><input class="i" id="npw" type="password" autocomplete="off"><div class="row2"><button class="btn" data-a="setpw">'+I('lock','sm')+'Change passphrase</button></div><p class="tag">This only hides the admin screen. Real protection is that only you hold the GitHub token.</p><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><b>Backup and restore</b><div class="row2"><button class="btn" data-a="copyjson">'+I('copy','sm')+'Copy backup</button><button class="btn" data-a="dljson">'+I('download','sm')+'Download backup</button></div><label class="f">Restore: paste a backup (items are added to your library)</label><textarea class="i" id="imp" rows="4" spellcheck="false"></textarea><div class="row2"><button class="btn" data-a="import">'+I('upload','sm')+'Import</button></div></div></div>'}

/* ---------- publishing ---------- */
function ghc(){var g=store('bl_gh')||{};return{owner:g.owner||'',repo:g.repo||'',branch:g.branch||'main',path:g.path||'data.json',remember:!!g.remember,token:g.token||store('bl_tok',undefined,true)||''}}
function setG(k,v){var g=store('bl_gh')||{},t;
  if(k==='token'){if(g.remember){g.token=v;store('bl_gh',g)}else store('bl_tok',v,true);return}
  if(k==='remember'){t=ghc().token;g.remember=v;if(v){g.token=t;store('bl_tok',null,true)}else{delete g.token;store('bl_tok',t,true)}store('bl_gh',g);return}
  g[k]=v;store('bl_gh',g)}
function publishErrors(){var e=[],p=work.items.filter(isPub);
  if(!p.length)e.push('Nothing is published. The site would be empty.');
  p.forEach(function(x){if(!x.name.trim())e.push('A published item has no name.');else if(!x.code.trim())e.push('"'+x.name+'" has no code.');else{var r=analyzeC(x.code);if(r.err)e.push('"'+x.name+'": '+r.err)}});return e}
function buildJson(){work.updated=new Date().toISOString();var o=clone(work);o.items.forEach(function(x){x.name=x.name.trim();x.code=clean(x.code)});return JSON.stringify(o,null,1)}
function tabPub(){var g=ghc(),np=work.items.filter(isPub).length,er=publishErrors();
  $('abody').innerHTML='<div class="box"><b>'+np+' published · '+(work.items.length-np)+' drafts</b>'+(er.length?'<p class="m bad" style="display:block">Fix before publishing:<br>'+er.slice(0,8).map(esc).join('<br>')+'</p>':'<p class="m ok">'+I('check','sm')+'<span>All published bookmarklets passed the check.</span></p>')+'</div><div class="two"><div><b>Option A: one-click to GitHub</b><label class="f">GitHub username</label><input class="i" data-g="owner" value="'+esc(g.owner)+'"><label class="f">Repository name</label><input class="i" data-g="repo" value="'+esc(g.repo)+'"><label class="f">Branch</label><input class="i" data-g="branch" value="'+esc(g.branch)+'"><label class="f">Data file</label><input class="i" data-g="path" value="'+esc(g.path)+'"><label class="f">Access token (fine-grained, Contents: Read and write, this repo only)</label><input class="i" data-g="token" type="password" autocomplete="off" value="'+esc(g.token)+'"><label class="f"><input type="checkbox" data-g="remember"'+(g.remember?' checked':'')+'> Remember token on this PC (otherwise forgotten when the tab closes)</label><div class="row2"><button class="btn" data-a="testgh">Test connection</button><button class="btn pri" data-a="pubgh">'+I('upload','sm')+'Publish now</button></div></div><div><b>Option B: copy and paste (no setup)</b>'+stepsH(['Press <b>Copy data.json</b>.','Open your repo on GitHub, click <b>data.json</b> (or <b>Add file, Create new file</b> named data.json the first time).','Click the pencil icon, press Ctrl+A, paste, then <b>Commit changes</b>.'])+'<div class="row2"><button class="btn pri" data-a="copyjson">'+I('copy','sm')+'Copy data.json</button><button class="btn" data-a="dljson">'+I('download','sm')+'Download</button></div><p class="tag">Use this if GitHub’s API is blocked on your network.</p></div></div><div class="log" id="log"></div>'}
function ghFail(e,L){if(e&&e.cancel)return L('Cancelled.');
  var m={401:'Token rejected (wrong or expired).',403:'Token has no permission. It needs Contents: Read and write on this repository.',404:'Repository, branch or user not found.',409:'Conflict. Try again.',422:'GitHub refused the update. Try again.'}[e&&e.status];
  L('Error: '+(m||(e&&e.status?'GitHub error '+e.status+'.':'Could not reach GitHub. It may be blocked on this network. Use Option B.')))}
function ghApi(g){return 'https://api.github.com/repos/'+encodeURIComponent(g.owner)+'/'+encodeURIComponent(g.repo)}
function ghHead(g){return{'Authorization':'Bearer '+g.token,'Accept':'application/vnd.github+json'}}
function testGH(){var g=ghc(),log=$('log');log.textContent='Testing…\n';
  function L(t){log.textContent+=t+'\n'}
  if(!g.owner||!g.repo||!g.token){L('Fill in username, repository and token first.');return}
  fetch(ghApi(g),{headers:ghHead(g)}).then(function(r){if(!r.ok)throw{status:r.status};return r.json()}).then(function(j){L(j.permissions&&j.permissions.push?'Connected. You can publish.':'Warning: connected, but this token cannot write to the repository.')}).catch(function(e){ghFail(e,L)})}
function publishGH(){var g=ghc(),log=$('log');log.textContent='';
  function L(t){log.textContent+=t+'\n'}
  if(!g.owner||!g.repo||!g.token){L('Fill in username, repository and token first.');return}
  var er=publishErrors();if(er.length){L('Fix these first:\n- '+er.join('\n- '));return}
  var api=ghApi(g)+'/contents/'+g.path.split('/').map(encodeURIComponent).join('/');L('Checking GitHub…');
  fetch(api+'?ref='+encodeURIComponent(g.branch),{headers:ghHead(g)}).then(function(r){
    if(r.status===404)return{sha:null,remote:null};
    if(!r.ok)throw{status:r.status};
    return r.json().then(function(j){var rm=null;try{rm=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))))}catch(e){}return{sha:j.sha,remote:rm}})
  }).then(function(c){
    if(c.remote&&c.remote.updated&&db.updated&&c.remote.updated!==db.updated&&!confirm('The live data changed since you opened this page (maybe from another PC). Overwrite it with your version?'))throw{cancel:1};
    var body=buildJson(),put={message:'Update bookmarklets ('+work.items.filter(isPub).length+' published)',content:btoa(unescape(encodeURIComponent(body))),branch:g.branch};
    if(c.sha)put.sha=c.sha;L('Publishing…');
    return fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHead(g)),body:JSON.stringify(put)}).then(function(r){if(!r.ok)throw{status:r.status};return body})
  }).then(function(body){setDb(JSON.parse(body));work=clone(db);store('bl_draft',null);updChip();L('Published. The live site updates in about a minute.')}).catch(function(e){ghFail(e,L)})}

/* ---------- events ---------- */
function act(a){var p=a.split(':'),k=p[0],id=p[1],i,x;
  if(k==='exit'){location.hash='';if(!document.body.classList.contains('admin'))return;hideAdmin()}
  else if(k==='login')doLogin();
  else if(k==='logout'){store('bl_auth',null,true);renderLogin()}
  else if(k==='tab'){tab=id;renderAdmin()}
  else if(k==='back'){tab='lib';renderAdmin()}
  else if(k==='new'){x={id:uid(),name:'',category:'General',icon:'bookmark',desc:'',code:'',status:'draft'};work.items.unshift(x);editId=x.id;tab='edit';saveDraft();renderAdmin()}
  else if(k==='edit'){editId=id;tab='edit';renderAdmin()}
  else if(k==='dup'){i=work.items.map(function(o){return o.id}).indexOf(id);x=clone(work.items[i]);x.id=uid();x.name+=' (copy)';x.status='draft';work.items.splice(i+1,0,x);saveDraft();tabLib()}
  else if(k==='up'||k==='dn'){i=work.items.map(function(o){return o.id}).indexOf(id);var j=k==='up'?i-1:i+1;if(j>=0&&j<work.items.length){x=work.items[i];work.items[i]=work.items[j];work.items[j]=x;saveDraft();drawTbl()}}
  else if(k==='del'){x=work.items.filter(function(o){return o.id===id})[0];if(confirm('Delete "'+(x.name||'this item')+'"?')){work.items=work.items.filter(function(o){return o.id!==id});saveDraft();tabLib()}}
  else if(k==='tog'){x=work.items.filter(function(o){return o.id===id})[0];x.status=isPub(x)?'draft':'published';saveDraft();drawTbl()}
  else if(k==='more'){aShown+=50;drawTbl()}
  else if(k==='copycur'){var r=analyze(cur().code);if(r.url)copyText(r.url).then(function(ok){toast(ok?'Copied!':'Copy failed.')})}
  else if(k==='pubone'){cur().status='published';saveDraft();tabEdit()}
  else if(k==='discard'){if(confirm('Throw away all unpublished changes?')){work=clone(db);store('bl_draft',null);tab='lib';renderAdmin()}}
  else if(k==='setpw'){var pw=$('npw').value;if(pw.length<6){toast('Use at least 6 characters.');return}hash(pw).then(function(h){work.settings.adminHash=h;saveDraft();$('npw').value='';toast('Changed. Active on the live site after you publish.')})}
  else if(k==='copyjson'||k==='copybk')copyText(buildJson()).then(function(ok){toast(ok?'Copied! Paste it where you need it.':'Copy failed. Use Download.')});
  else if(k==='dljson'||k==='dlbk')dl('data.json',buildJson());
  else if(k==='import'){try{var d=JSON.parse($('imp').value),arr=Array.isArray(d)?d:d.items,n=0;(arr||[]).forEach(function(o){if(o&&o.code){work.items.push({id:uid(),name:o.name||'Imported',category:o.category||'General',icon:o.icon||'bookmark',desc:o.desc||'',code:o.code,status:o.status==='published'?'published':'draft'});n++}});saveDraft();$('imp').value='';toast(n+' imported.')}catch(e){toast('That is not a valid backup.')}}
  else if(k==='testgh')testGH();
  else if(k==='pubgh')publishGH()}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a],[data-v],[data-copy],[data-open],[data-fav],[data-close],[data-seg],[data-pick]');if(!t)return;
  if(t.dataset.a!==undefined){e.preventDefault();act(t.dataset.a)}
  else if(t.dataset.v){view=t.dataset.v;shown=PAGE;render(true);closeDrawer()}
  else if(t.dataset.copy!==undefined)doCopy(t.dataset.copy,t);
  else if(t.dataset.open!==undefined)openItem(t.dataset.open);
  else if(t.dataset.fav!==undefined){var id=t.dataset.fav,i=favs.indexOf(id);if(i<0)favs.push(id);else favs.splice(i,1);store('bl_favs2',favs);render()}
  else if(t.dataset.seg!==undefined){var sg=t.closest('.seg'),n=+t.dataset.seg;sg.dataset.i=n;Array.prototype.forEach.call(sg.querySelectorAll('button'),function(b,k){b.classList.toggle('on',k===n)});Array.prototype.forEach.call($('drawer').querySelectorAll('.pane'),function(p,k){p.classList.toggle('on',k===n)})}
  else if(t.dataset.pick){var pp=t.dataset.pick.split(':');if(pp[0]==='icon'){cur().icon=pp[1];saveDraft();tabEdit()}else{work.settings.logo=pp[1];saveDraft();applySettings(work.settings);tabSet()}}
  else if(t.hasAttribute('data-close'))closeDrawer()});
function onField(e){var t=e.target,x;
  if(t.dataset.f){x=cur();x[t.dataset.f]=t.value;saveDraft();if(t.dataset.f==='code'||t.dataset.f==='name')updateChk()}
  else if(t.dataset.s){work.settings[t.dataset.s]=t.value;saveDraft();applySettings(work.settings)}
  else if(t.dataset.g)setG(t.dataset.g,t.type==='checkbox'?t.checked:t.value.trim());
  else if(t.id==='aq'){aq=t.value;aShown=50;drawTbl()}}
document.addEventListener('input',onField);
document.addEventListener('change',function(e){var t=e.target;
  if(t.dataset&&t.dataset.f==='code'){var x=cur(),c=clean(t.value);if(c!==t.value){x.code=c;t.value=c;saveDraft();updateChk()}}
  else if(t.dataset&&t.dataset.g==='remember')onField(e)});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeDrawer();
  if(e.key==='Enter'&&e.target.id==='pw')doLogin();
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!document.body.classList.contains('admin')){e.preventDefault();$('q').focus()}});
$('shade').onclick=closeDrawer;
$('q').oninput=function(){query=this.value;shown=PAGE;render()};
$('more').onclick=function(){shown+=PAGE;render()};
$('howBtn').innerHTML=I('help')+'<span>How to use</span>';
$('howBtn').onclick=openHow;
$('menuBtn').innerHTML=I('menu');
$('sIc').innerHTML=I('search','sm');
$('menuBtn').onclick=function(){var s=$('side');s.classList.toggle('on');$('shade').classList.toggle('on',s.classList.contains('on'))};
function setTheme(t){document.documentElement.dataset.theme=t;$('theme').innerHTML=I(t==='dark'?'sun':'moon');store('bl_theme',t)}
$('theme').onclick=function(){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')};
setTheme(store('bl_theme')||'light');
function route(){closeDrawer();if(location.hash==='#admin')showAdmin();else hideAdmin()}
window.addEventListener('hashchange',route);
load().then(function(){applySettings(db.settings);render(true);if(location.hash==='#admin')showAdmin()});
})();
</script>
</body>
